<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0718"/>
      <stop offset="100%" style="stop-color:#120a26"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff2bd6"/>
      <stop offset="33%" style="stop-color:#b026ff"/>
      <stop offset="66%" style="stop-color:#00f0ff"/>
      <stop offset="100%" style="stop-color:#39ff14"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff2bd6"/>
      <stop offset="50%" style="stop-color:#b026ff"/>
      <stop offset="100%" style="stop-color:#00f0ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- Neon ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#ring)" stroke-width="12" filter="url(#glow)"/>
  <!-- CM text -->
  <text x="256" y="290" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="900" font-size="220" fill="url(#text)" filter="url(#glow)">CM</text>
</svg>
